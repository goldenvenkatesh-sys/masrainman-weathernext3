name: MasRainMan AI forecast on the site

# Shows our own AI model's 10-day forecast at <site>/ai/ (button "MasRainMan AI" on the main page).
# The forecast itself is made in the private masrainman-model repo (its daily_forecast workflow,
# 14:00 IST with backups) and published on that repo's "live" branch; this workflow copies the
# newest maps here, saves them in site-data like the other pages, and redeploys Cloudflare.
# It also redeploys when new verification scores arrive (verif-site's stamp.txt), and publishes the
# same two pages, without login, to the public Cloudflare project masrainman-ai (embedded on the
# MasRainman Blogger page). Only the AI forecast and verification go there, nothing else of the site.
# Needs the secret MASRAINMAN_MODEL_TOKEN: a fine-grained GitHub token with read-only
# "Contents" access to goldenvenkatesh-sys/masrainman-model.
on:
  push:                              # once whenever this page or workflow changes
    branches: [main]
    paths: ["web/ai.html", "web/ai_verify.html", ".github/workflows/masrainman-ai.yml"]
  schedule:                          # after each of the forecast's run times; quick no-op if nothing new
    - cron: "25 9 * * *"             # 2:55 PM IST  00 UTC run
    - cron: "5 11 * * *"             # 4:35 PM IST
    - cron: "35 14 * * *"            # 8:05 PM IST  06 UTC run
    - cron: "55 21 * * *"            # 3:25 AM IST  12 UTC run
    - cron: "35 2 * * *"             # 8:05 AM IST  18 UTC run (the hourly rain job is the main backup)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weathernext3                # never runs at the same time as the other site jobs
  cancel-in-progress: false

env:
  CF_PROJECT: masrainman-wn3
  PUBLIC_PROJECT: masrainman-ai      # public, no login: AI forecast + verification for the blog
  MODEL_REPO: goldenvenkatesh-sys/masrainman-model

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Newest MasRainMan AI forecast
        id: get
        env:
          TOKEN: ${{ secrets.MASRAINMAN_MODEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret MASRAINMAN_MODEL_TOKEN is missing"; exit 1; fi
          git clone -q --depth 1 -b live "https://x-access-token:${TOKEN}@github.com/${MODEL_REPO}.git" "$RUNNER_TEMP/ai"
          new=$(cat "$RUNNER_TEMP/ai/cycle.txt")
          git clone -q --depth 1 -b verif-site "https://x-access-token:${TOKEN}@github.com/${MODEL_REPO}.git" "$RUNNER_TEMP/verify" \
            || echo "No verification data yet"
          vnew=$(cat "$RUNNER_TEMP/verify/stamp.txt" 2>/dev/null || true)
          git fetch -q --depth 1 origin site-data 2>/dev/null || true
          have=$(git show FETCH_HEAD:ai/cycle.txt 2>/dev/null || true)
          vhave=$(git show FETCH_HEAD:ai/verify/stamp.txt 2>/dev/null || true)
          echo "MasRainMan AI forecast $new (site '${have}'), verification $vnew (site '${vhave}')"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$new" = "$have" ] && [ "$vnew" = "$vhave" ]; then
            echo "::notice::The site already shows forecast $new and the latest scores"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current maps (site-data branch)
        if: steps.get.outputs.new == 'true'
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git fetch --depth 1 origin site-data
            git --work-tree=site checkout origin/site-data -- .
            git reset -q
          fi

      - name: Add the MasRainMan AI page
        if: steps.get.outputs.new == 'true'
        run: |
          rm -rf site/ai && mkdir -p site/ai
          cp "$RUNNER_TEMP"/ai/*.png "$RUNNER_TEMP/ai/manifest.json" "$RUNNER_TEMP/ai/cycle.txt" site/ai/
          cp web/ai.html site/ai/index.html
          # Verification page: scores and maps from the model repo's verif-site branch
          mkdir -p site/ai/verify
          cp web/ai_verify.html site/ai/verify/index.html
          if [ -d "$RUNNER_TEMP/verify" ]; then
            rm -rf "$RUNNER_TEMP/verify/.git"
            cp -r "$RUNNER_TEMP"/verify/* site/ai/verify/
          fi
          cp web/index.html site/ 2>/dev/null || true   # main page with the MasRainMan AI button
          ls site/ai

      - name: Save maps (site-data branch, private)
        if: steps.get.outputs.new == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: site-data
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "MasRainMan AI forecast update"

      - name: Add rainfall reports (TN / Kerala / Karnataka / AP)
        if: steps.get.outputs.new == 'true'
        run: |
          cp web/index.html web/rain.html web/landfall.html web/outlook.html site/ 2>/dev/null || true
          bash get_rain_reports.sh site

      - name: Publish to Cloudflare Pages (login-protected)
        if: steps.get.outputs.new == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

      # Public copy for the Blogger page: only the AI forecast and its verification. Links back to the
      # private dashboard are taken out; the blog link is added instead.
      - name: Publish the public AI pages (masrainman-ai, no login)
        if: steps.get.outputs.new == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf public && cp -r site/ai public
          blog='<a class="btn" href="https://masrainman.blogspot.com/" target="_top">🏠 MasRainman blog</a>'
          sed -i -e '\#href="\.\./mme/"#d' -e "s#<a class=\"btn\" href=\"\.\./\">[^<]*</a>#${blog}#" public/index.html
          sed -i -e "s#<a class=\"btn\" href=\"\.\./\.\./\">[^<]*</a>#${blog}#" public/verify/index.html
          grep -c 'href="\.\./\.\./"\|href="\.\./mme/"' public/index.html public/verify/index.html || true
          npx --yes wrangler@3 pages project create "$PUBLIC_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy public --project-name="$PUBLIC_PROJECT" --branch=main --commit-dirty=true
