name: MasRainman multi-model (rain + LPA + cyclone)

# Multi-model weighted rainfall (Day 1-15, 7-day, 15-day; ensemble + deterministic blends), single-model
# rain totals for the public blog page (WeatherNext 3, ECMWF IFS, AIFS, GFS, AIGFS: 24 h, 7 days, 15 days),
# LPA tracker and cyclone tracker for the 00 UTC and 12 UTC cycles, published at <site>/mme/.
# Twice a day (about 30-45 minutes per run). GitHub's timer is often hours late or skips runs,
# so there are backup times, and the hourly "Rain reports on the site" job also starts this one
# when a cycle is due. A run that finds the cycle already on the site stops after ~20 seconds.
on:
  push:                              # also run once whenever the multi-model code changes
    branches: [main]
    paths: ["multimodel/**", ".github/workflows/mme.yml"]
  schedule:
    - cron: "47 9 * * *"            # 3:17 PM IST  - 00 UTC cycle (all models out ~09 UTC)
    - cron: "37 12 * * *"           # 6:07 PM IST  - 00 UTC backup
    - cron: "47 21 * * *"           # 3:17 AM IST  - 12 UTC cycle
    - cron: "37 0 * * *"            # 6:07 AM IST  - 12 UTC backup
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDHH, e.g. 2026110100 (empty = latest 00/12 UTC)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weathernext3                # never runs at the same time as the model-maps job
  cancel-in-progress: false

env:
  CF_PROJECT: masrainman-wn3
  SITE_DIR: ${{ github.workspace }}/site/mme
  MME_CACHE: ${{ github.workspace }}/mme_cache
  KEEP_CYCLES: "2"
  # Members downloaded per ensemble (more = slower). Rain uses ensemble means; tracks use members.
  ECMWF_ENS_MEMBERS: "20"
  AIFS_ENS_MEMBERS: "20"
  TRACK_ECMWF_ENS_MEMBERS: "20"
  TRACK_AIFS_ENS_MEMBERS: "20"
  TRACK_GEFS_MEMBERS: "20"

jobs:
  mme:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current maps (site-data branch)
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git fetch --depth 1 origin site-data
            git --work-tree=site checkout origin/site-data -- .
            git reset -q
          fi
          ls site/mme 2>/dev/null || echo "(no multi-model maps yet)"

      - name: Is this cycle already on the site?
        id: due
        run: |
          cyc=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          n = datetime.now(timezone.utc) - timedelta(hours=9)
          print(n.strftime('%Y%m%d') + ('00' if n.hour < 12 else '12'))")
          if [ -n "${{ github.event.inputs.cycle }}" ]; then cyc="${{ github.event.inputs.cycle }}"; fi
          echo "cycle=$cyc" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] && [ -z "${{ github.event.inputs.cycle }}" ] && \
             ls site/mme/tracks/$cyc/*.png >/dev/null 2>&1 && ls site/mme/rain/$cyc >/dev/null 2>&1; then
            echo "::notice::Multi-model cycle $cyc is already on the site - nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Multi-model cycle $cyc is due"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google login (WeatherNext 3 access)
        if: steps.due.outputs.run == 'true'
        env:
          GCP_CREDS: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_CREDS" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Install packages
        if: steps.due.outputs.run == 'true'
        run: |
          pip install -q -r requirements.txt
          pip install -q -r multimodel/requirements.txt

      - name: Cache map coastlines and India boundaries
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cartopy
            multimodel/boundaries
          key: mme-boundaries-v1

      - name: Rainfall (ensemble + deterministic blends)
        if: steps.due.outputs.run == 'true'
        id: rain
        continue-on-error: true
        timeout-minutes: 70
        working-directory: multimodel
        run: |
          mkdir -p "$SITE_DIR"
          set -o pipefail
          python -u run_rain.py ${{ github.event.inputs.cycle && format('--cycle {0}', github.event.inputs.cycle) || '' }} 2>&1 | tee "$SITE_DIR/last_log_rain.txt"

      - name: LPA + cyclone trackers
        if: steps.due.outputs.run == 'true'
        id: tracks
        continue-on-error: true
        timeout-minutes: 45
        working-directory: multimodel
        run: |
          set -o pipefail
          python -u run_tracks.py ${{ github.event.inputs.cycle && format('--cycle {0}', github.event.inputs.cycle) || '' }} 2>&1 | tee "$SITE_DIR/last_log_tracks.txt"

      - name: Page + manifest
        id: page
        if: steps.rain.outcome == 'success' || steps.tracks.outcome == 'success'
        working-directory: multimodel
        run: python mme_site.py

      - name: Save maps (site-data branch, private)
        if: steps.page.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: site-data
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "MasRainman multi-model update"

      - name: Add rainfall reports (TN / Kerala / Karnataka / AP)
        if: steps.page.outcome == 'success'
        run: |
          cp web/index.html web/rain.html web/landfall.html web/outlook.html site/ 2>/dev/null || true
          bash get_rain_reports.sh site

      - name: Publish to Cloudflare Pages (login-protected)
        if: steps.page.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

      # Public pages for the blog (masrainman-ai, no login), so new single-model rain totals
      # (24 h / 7 days / 15 days) show up straight away. Same script as the other two workflows.
      - name: Publish the public pages (masrainman-ai, no login)
        if: steps.page.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash build_public.sh site
          npx --yes wrangler@3 pages project create masrainman-ai --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy public --project-name=masrainman-ai --branch=main --commit-dirty=true
