name: Rain reports on the site

# Republishes the Cloudflare site with the newest rainfall reports (Rain reports page),
# keeping the model maps exactly as the last model run saved them (site-data branch).
#  - when the rain-report repo sends "rain-reports" (needs its WN3_DISPATCH_TOKEN secret)
#  - otherwise every hour
on:
  repository_dispatch:
    types: [rain-reports]
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: rain-publish
  cancel-in-progress: true

env:
  CF_PROJECT: masrainman-wn3

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Get current maps (site-data branch)
        run: |
          mkdir -p site
          if git fetch -q --depth 1 origin site-data 2>/dev/null; then
            git --work-tree=site checkout -q FETCH_HEAD -- . && git reset -q
            git rev-parse FETCH_HEAD > "$RUNNER_TEMP/maps_sha"
          fi

      # GitHub's own timer can start late or skip runs. This hourly workflow also starts
      # the model maps and multi-model tracker when they are due.
      - name: Start model maps / cyclone tracker when due
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          busy() { gh run list -R "$R" -w "$1" -L 5 --json status -q '[.[]|select(.status!="completed")]|length'; }
          last=$(gh run list -R "$R" -w weathernext3.yml -L 1 --json createdAt -q '.[0].createdAt')
          slot=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          slots = [now.replace(hour=h, minute=41, second=0, microsecond=0) - timedelta(days=d)
                   for d in (0, 1) for h in range(1, 24, 3)]
          print(max(s for s in slots if s <= now).isoformat())")
          echo "Last model-maps run: ${last:-none} · last slot: $slot"
          if [ "$(busy weathernext3.yml)" = "0" ] && \
             { [ -z "$last" ] || [ "$(date -d "$last" +%s)" -lt "$(date -d "$slot" +%s)" ]; }; then
            gh workflow run weathernext3.yml -R "$R" --ref main && echo "started model maps"
          fi
          cyc=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          n = datetime.now(timezone.utc) - timedelta(hours=9)
          print(n.strftime('%Y%m%d') + ('00' if n.hour < 12 else '12'))")
          if ls site/mme/tracks/$cyc/*.png >/dev/null 2>&1; then
            echo "Multi-model cycle $cyc already on the site"
          elif [ "$(busy mme.yml)" != "0" ]; then
            echo "Multi-model run already going"
          else
            last=$(gh run list -R "$R" -w mme.yml -L 1 --json createdAt -q '.[0].createdAt')
            if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt 10800 ]; then
              gh workflow run mme.yml -R "$R" --ref main && echo "started multi-model cycle $cyc"
            fi
          fi

      # District ensemble rain charts: GitHub's 3-hourly timer often skips runs, so a new ECMWF ENS
      # run (00Z out by ~09:30 UTC, 12Z by ~21:30 UTC) could wait 6 h or more. Start it once per new run.
      - name: Start ensemble rain charts when a new ECMWF ENS run is out
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          ready=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          t = [now.replace(hour=h, minute=40, second=0, microsecond=0) - timedelta(days=d)
               for d in (0, 1) for h in (9, 21)]
          print(max(x for x in t if x <= now).isoformat())")
          last=$(gh run list -R "$R" -w ens-rain.yml -L 1 --json createdAt -q '.[0].createdAt')
          busy=$(gh run list -R "$R" -w ens-rain.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length')
          echo "Ensemble charts: newest ENS run out since $ready · last run ${last:-none} · running $busy"
          if [ "$busy" = "0" ] && { [ -z "$last" ] || [ "$(date -d "$last" +%s)" -lt "$(date -d "$ready" +%s)" ]; }; then
            gh workflow run ens-rain.yml -R "$R" --ref main && echo "started ensemble rain charts"
          fi

      # Check whether a newer forecast is ready for the MasRainMan AI page.
      - name: Start MasRainMan AI page update when a new forecast is ready
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_TOKEN: ${{ secrets.MASRAINMAN_MODEL_TOKEN }}
        run: |
          R="$GITHUB_REPOSITORY"
          [ -n "$MODEL_TOKEN" ] || { echo "No MASRAINMAN_MODEL_TOKEN; skipping AI check"; exit 0; }
          new=$(curl -fsS -H "Authorization: Bearer $MODEL_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/goldenvenkatesh-sys/masrainman-model/contents/cycle.txt?ref=live" | tr -d '[:space:]')
          have=$(tr -d '[:space:]' < site/ai/cycle.txt 2>/dev/null || true)
          vnew=$(curl -fsS -H "Authorization: Bearer $MODEL_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/goldenvenkatesh-sys/masrainman-model/contents/stamp.txt?ref=verif-site" 2>/dev/null | tr -d '[:space:]' || true)
          vhave=$(tr -d '[:space:]' < site/ai/verify/stamp.txt 2>/dev/null || true)
          echo "MasRainMan AI: model has '${new}', site has '${have}'; scores '${vnew}', site '${vhave}'"
          busy=$(gh run list -R "$R" -w masrainman-ai.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length')
          if [ -n "$new" ] && { [ "$new" != "$have" ] || [ "$vnew" != "$vhave" ]; } && [ "$busy" = "0" ]; then
            gh workflow run masrainman-ai.yml -R "$R" --ref main && echo "started MasRainMan AI update $new"
          fi

          want=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          n = datetime.now(timezone.utc)
          if n.hour >= 21: c = n.replace(hour=12)
          elif n.hour >= 14: c = n.replace(hour=6)
          elif n.hour >= 9: c = n.replace(hour=0)
          elif n.hour >= 3: c = (n - timedelta(days=1)).replace(hour=18)
          else: c = (n - timedelta(days=1)).replace(hour=12)
          print(c.strftime('%Y%m%d%H'))")
          echo "MasRainMan AI: newest ECMWF run expected $want"
          if [ -n "$new" ] && [ "$new" -lt "$want" ]; then
            M=https://api.github.com/repos/goldenvenkatesh-sys/masrainman-model/actions
            H=(-H "Authorization: Bearer $MODEL_TOKEN" -H "Accept: application/vnd.github+json")
            runs=$(curl -fsS "${H[@]}" "$M/workflows/daily_forecast.yml/runs?per_page=1") || {
              echo "::warning::Model forecast $want is late, but MASRAINMAN_MODEL_TOKEN can't see the model's Actions. Give the token 'Actions: Read and write'."; exit 0; }
            last=$(echo "$runs" | python3 -c "import json,sys; r=json.load(sys.stdin)['workflow_runs']; print((r[0]['status']+' '+r[0]['created_at']) if r else '')")
            st=${last%% *}; at=${last#* }
            if [ "$st" != "completed" ] && [ -n "$last" ]; then
              echo "Model run already going"
            elif [ -n "$at" ] && [ $(( $(date +%s) - $(date -d "$at" +%s) )) -lt 7200 ]; then
              echo "Model was started less than 2 h ago"
            else
              curl -fsS -X POST "${H[@]}" "$M/workflows/daily_forecast.yml/dispatches" -d '{"ref":"main"}' \
                && echo "started model forecast for $want" \
                || echo "::warning::Couldn't start the model. Give MASRAINMAN_MODEL_TOKEN 'Actions: Read and write'."
            fi
          fi

      - name: Add rainfall reports
        run: bash get_rain_reports.sh site

      - name: Use the newest maps (if a model run just finished)
        run: |
          if git fetch -q --depth 1 origin site-data 2>/dev/null && \
             [ "$(git rev-parse FETCH_HEAD)" != "$(cat "$RUNNER_TEMP/maps_sha" 2>/dev/null)" ]; then
            echo "Model maps changed meanwhile; refreshing them."
            mv site/rain "$RUNNER_TEMP/rain" && rm -rf site && mkdir site
            git --work-tree=site checkout -q FETCH_HEAD -- . && git reset -q
            mv "$RUNNER_TEMP/rain" site/rain
            cp web/index.html web/rain.html web/landfall.html web/outlook.html site/
          fi

      - name: Add ensemble rain charts (ens-data branch)
        run: bash get_ens.sh site

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
