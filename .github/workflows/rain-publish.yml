name: Rain reports on the site

# Republishes the Cloudflare site with the newest rainfall reports (Rain reports page),
# keeping the model maps exactly as the last model run saved them (site-data branch).
#  - instantly, when the rain-report repo sends "rain-reports" (needs its WN3_DISPATCH_TOKEN secret)
#  - otherwise every hour
on:
  # Manual only (automatic runs switched off on request). To turn them back on, add:
  #   repository_dispatch:
  #     types: [rain-reports]
  #   schedule:
  #     - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: rain-publish
  cancel-in-progress: true

env:
  CF_PROJECT: masrainman-wn3

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Model maps at 12 AM, 6 AM, 1 PM and 5:30 PM IST. This workflow is started about every hour,
      # so it starts the model maps when a slot has passed since their last run (GitHub's own timer
      # often skips them). Uses this repository's own token: no extra secret needed.
      - name: Start model maps when due
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w weathernext3.yml -L 1 --json createdAt -q '.[0].createdAt')
          slot=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          slots = [now.replace(hour=h, minute=m, second=0, microsecond=0) - timedelta(days=d)
                   for d in (0, 1) for h, m in ((0, 0), (6, 0), (13, 0), (17, 30))]
          print(max(s for s in slots if s <= now).isoformat())")
          echo "Last model-maps run: ${last:-none} · last slot: $slot"
          if [ -z "$last" ] || [ "$(date -d "$last" +%s)" -lt "$(date -d "$slot" +%s)" ]; then
            gh workflow run weathernext3.yml -R "$GITHUB_REPOSITORY" --ref main && echo "started model maps"
          fi

      - name: Get current maps (site-data branch)
        run: |
          mkdir -p site
          if git fetch -q --depth 1 origin site-data 2>/dev/null; then
            git --work-tree=site checkout -q FETCH_HEAD -- . && git reset -q
            git rev-parse FETCH_HEAD > "$RUNNER_TEMP/maps_sha"
          fi

      - name: Add rainfall reports
        run: bash get_rain_reports.sh site

      - name: Use the newest maps (if a model run just finished)
        run: |
          if git fetch -q --depth 1 origin site-data 2>/dev/null && \
             [ "$(git rev-parse FETCH_HEAD)" != "$(cat "$RUNNER_TEMP/maps_sha" 2>/dev/null)" ]; then
            echo "Model maps changed meanwhile; refreshing them."
            mv site/rain "$RUNNER_TEMP/rain" && rm -rf site && mkdir site
            git --work-tree=site checkout -q FETCH_HEAD -- . && git reset -q
            mv "$RUNNER_TEMP/rain" site/rain
            cp web/index.html web/rain.html site/
          fi

      - name: Add 3D cyclone view
        run: bash get_cyclone3d.sh site

      - name: Publish to Cloudflare Pages (login-protected)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
