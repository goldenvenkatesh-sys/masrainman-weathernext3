name: Weather Lab probe (temporary)
on:
  push:
    branches: [claude/weatherlab-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 3
        run: |
          UA="Mozilla/5.0"
          curl -s -A "$UA" -L https://deepmind.google.com/science/weatherlab/ -o page.html
          grep -oE '.{0,160}(cyclones/|weathernext-public|ensemble/|paired|genesis|track_id|tcvitals).{0,200}' page.html | sort -u | head -50
          echo ==== scripts
          grep -oE '<script[^>]*src=[^>]*>' page.html | head
          for u in $(grep -oE 'https://[^"'"'"' )]+' page.html | grep -iE 'weatherlab|weathernext|cyclone' | sort -u | head -40); do echo "URL $u"; done
