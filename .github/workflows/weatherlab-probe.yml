name: Weather Lab probe (temporary)
on:
  push:
    branches: [claude/weatherlab-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 6
        run: |
          pip install -q pypdf
          curl -s -o r.pdf https://storage.googleapis.com/weathernext-public/cyclones/README.pdf
          python3 -c "
          import pypdf; r=pypdf.PdfReader('r.pdf'); print('\n'.join(p.extract_text() for p in r.pages))"
