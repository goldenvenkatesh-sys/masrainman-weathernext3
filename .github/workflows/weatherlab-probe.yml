name: Weather Lab probe (temporary)
on:
  push:
    branches: [claude/weatherlab-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 5
        run: |
          python3 - <<'PY'
          import requests
          B="https://storage.googleapis.com/storage/v1/b/weathernext-public/o"
          def ls(prefix,n=40):
              d=requests.get(B,params={"prefix":prefix,"delimiter":"/","maxResults":1000}).json()
              P=d.get("prefixes",[]); I=d.get("items",[])
              print(repr(prefix),len(P),"prefixes:",P[:8],"...",P[-8:]); print("   items",len(I),[(i["name"],i["size"],i.get("updated","")[:16]) for i in I[-n:]])
              return P,I
          P,_=ls("cyclones/")
          for p in P:
              P2,_=ls(p)
              for q in P2[-3:]:
                  P3,_=ls(q,10)
                  for r in P3[-2:]:
                      P4,_=ls(r,10)
                      for t in P4[-2:]: ls(t,10)
          PY
