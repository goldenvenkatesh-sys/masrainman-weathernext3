name: MasRainman model maps (WeatherNext 3 + ECMWF IFS + AIFS)

on:
  schedule:
    - cron: "30 0,7,18 * * *"      # 6:00 AM, 1:00 PM, 12:00 midnight IST
    - cron: "0 12 * * *"            # 5:30 PM IST
  workflow_dispatch:
    inputs:
      model:
        description: "Model for a forced run (only used when 'run' is filled)"
        required: false
        type: choice
        options: [wn3, ifs, aifs]
        default: wn3
      run:
        description: "Force one run: WN3 20261019_00hr_01_preds, IFS/AIFS 20261019_12 (empty = automatic)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weathernext3
  cancel-in-progress: false

env:
  SITE_DIR: site
  KEEP_RUNS: "4"
  CF_PROJECT: masrainman-wn3        # Cloudflare Pages project name
  # To save GitHub minutes, draw only the 15-day ECMWF runs (00Z and 12Z):
  # remove the # at the start of the next line.
  # ECMWF_CYCLES: "00,12"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current maps (site-data branch)
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git fetch --depth 1 origin site-data
            git --work-tree=site checkout origin/site-data -- .
            git reset -q
          fi
          ls site/runs 2>/dev/null || echo "(no WeatherNext 3 maps yet)"
          ls site/ecmwf/ifs site/ecmwf/aifs 2>/dev/null || echo "(no ECMWF maps yet)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google login (your WeatherNext access)
        env:
          GCP_CREDS: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_CREDS" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Quick check for new runs
        id: check
        run: |
          pip install -q google-auth requests
          python check_new.py

      # WeatherNext 3 24-h rain over Tamil Nadu for the rain report's model scorecard (live24).
      # Runs every time (not only when there is a new run) so missing days are filled in.
      - name: Save WeatherNext 3 rain for the rain report
        id: rain24
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          python export_rain24.py site

      # ---------- everything below runs only when there is work ----------

      - name: Install packages
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        run: |
          pip install -q -r requirements.txt
          # ECMWF GRIB reading (eccodes wheel includes the library)
          pip install -q requests xarray cfgrib "eccodes>=2.39"

      - name: Cache map coastlines
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Render new runs
        id: render
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        run: |
          if [ -n "${{ github.event.inputs.run }}" ]; then
            python render.py --model "${{ github.event.inputs.model }}" --run "${{ github.event.inputs.run }}"
          else
            python render.py
          fi

      - name: Save maps (site-data branch, private)
        if: steps.render.outcome == 'success' || steps.rain24.outputs.new == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: site-data
          force_orphan: true   # keeps repo small: no image history
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "MasRainman model maps update"

      - name: Add rainfall reports (TN / Kerala / Karnataka / AP)
        if: steps.render.outcome == 'success'
        run: bash get_rain_reports.sh site

      - name: Publish to Cloudflare Pages (login-protected)
        if: steps.render.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
