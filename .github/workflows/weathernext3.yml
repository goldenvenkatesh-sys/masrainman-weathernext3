name: MasRainman model maps (WeatherNext 3 + ECMWF IFS + AIFS)

on:
  schedule:
    - cron: "30 0,7,18 * * *"      # 6:00 AM, 1:00 PM, 12:00 midnight IST
    - cron: "0 12 * * *"            # 5:30 PM IST
  workflow_dispatch:
    inputs:
      model:
        description: "Model for a forced run (only used when 'run' is filled)"
        required: false
        type: choice
        options: [wn3, ifs, aifs]
        default: wn3
      run:
        description: "Force one run: WN3 20261019_00hr_01_preds, IFS/AIFS 20261019_12 (empty = automatic)"
        required: false
        default: ""
      outlook_run:
        description: "NEM outlook: redo one ECMWF run, e.g. 20261031_00 (empty = newest new run)"
        required: false
        default: ""
      outlook_backfill:
        description: "NEM outlook: archive this many past days of ECMWF ENS tracks for verification (e.g. 30; empty = none)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weathernext3
  cancel-in-progress: false

env:
  SITE_DIR: site
  KEEP_RUNS: "4"
  CF_PROJECT: masrainman-wn3        # Cloudflare Pages project name
  # To save GitHub minutes, draw only the 15-day ECMWF runs (00Z and 12Z):
  # remove the # at the start of the next line.
  # ECMWF_CYCLES: "00,12"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current maps (site-data branch)
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git fetch --depth 1 origin site-data
            git --work-tree=site checkout origin/site-data -- .
            git reset -q
          fi
          ls site/runs 2>/dev/null || echo "(no WeatherNext 3 maps yet)"
          ls site/ecmwf/ifs site/ecmwf/aifs 2>/dev/null || echo "(no ECMWF maps yet)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google login (your WeatherNext access)
        env:
          GCP_CREDS: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_CREDS" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Quick check for new runs
        id: check
        run: |
          pip install -q google-auth requests
          python check_new.py

      # WeatherNext 3 24-h rain over Tamil Nadu for the rain report's model scorecard (live24).
      # Runs every time (not only when there is a new run) so missing days are filled in.
      - name: Save WeatherNext 3 rain for the rain report
        id: rain24
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          python export_rain24.py site

      # A public copy of those files for the rain report, which has no token for this private repo:
      # one small file per rain-day, wn3_<YYYY-MM-DD>.json, from the 12 UTC run two days before
      # (the run the scorecard uses). A 'wn3data' branch copy of the site's Cloudflare project, outside its login.
      - name: Publish WeatherNext 3 rain for the rain report
        if: steps.rain24.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/wn3pub"
          python - "$RUNNER_TEMP/wn3pub" <<'EOF'
          import glob, json, os, sys
          from datetime import date, timedelta
          out = sys.argv[1]
          for f in glob.glob("site/rain24/wn3_*_12.json"):
              run = os.path.basename(f)[4:12]
              for d, w in json.load(open(f)).get("windows", {}).items():
                  if (date.fromisoformat(d) - timedelta(days=2)).strftime("%Y%m%d") == run:
                      json.dump(w, open(os.path.join(out, f"wn3_{d}.json"), "w"))
          print("files:", " ".join(sorted(os.listdir(out))))
          EOF
          npx --yes wrangler@3 pages deploy "$RUNNER_TEMP/wn3pub" --project-name="$CF_PROJECT" --branch=wn3data --commit-dirty=true

      # ---------- everything below runs only when there is work ----------

      - name: Install packages
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        run: |
          pip install -q -r requirements.txt
          # ECMWF GRIB reading (eccodes wheel includes the library)
          pip install -q requests xarray cfgrib "eccodes>=2.39"

      - name: Cache map coastlines
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Render new runs
        id: render
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        run: |
          if [ -n "${{ github.event.inputs.run }}" ]; then
            python render.py --model "${{ github.event.inputs.model }}" --run "${{ github.event.inputs.run }}"
          else
            python render.py
          fi

      # Ensemble landfall maps: ECMWF ENS tracks, plus GEFS and UKMET tracked from their fields.
      # Runs every time and only draws runs that are not on the site yet (a few minutes when it does).
      - name: Landfall maps
        id: landfall
        continue-on-error: true
        timeout-minutes: 40
        run: |
          pip install -q -r requirements.txt
          python landfall.py

      # NEM & cyclone outlook (genesis, days 1-15 cyclone analysis, 30-day NEM rain, active/break,
      # track consistency, PDI, verification). Only new ECMWF 00Z/12Z runs; state kept in site/outlook/state.
      - name: NEM & cyclone outlook
        id: outlook
        continue-on-error: true
        timeout-minutes: 75
        env:
          OUTLOOK_BACKFILL_DAYS: ${{ github.event.inputs.outlook_backfill }}
          OUTLOOK_RUN: ${{ github.event.inputs.outlook_run }}
        run: |
          pip install -q -r requirements.txt
          pip install -q xarray cfgrib netCDF4 "eccodes>=2.39"
          mkdir -p site/outlook/state
          set -o pipefail
          python -u nem_outlook.py 2>&1 | tee site/outlook/state/last_log.txt

      - name: Save maps (site-data branch, private)
        if: steps.render.outcome == 'success' || steps.rain24.outputs.new == 'true' || steps.landfall.outputs.new == 'true' || steps.outlook.outputs.new == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: site-data
          force_orphan: true   # keeps repo small: no image history
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "MasRainman model maps update"

      - name: Add rainfall reports (TN / Kerala / Karnataka / AP)
        if: steps.render.outcome == 'success' || steps.landfall.outputs.new == 'true' || steps.outlook.outputs.new == 'true'
        run: bash get_rain_reports.sh site

      - name: Publish to Cloudflare Pages (login-protected)
        if: steps.render.outcome == 'success' || steps.landfall.outputs.new == 'true' || steps.outlook.outputs.new == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
