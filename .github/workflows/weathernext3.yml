name: MasRainman model maps (WeatherNext 3 + ECMWF IFS + AIFS)

on:
  schedule:
    # Every 3 hours at :20 UTC (05:50, 08:50, 11:50, 14:50, 17:50, 20:50,
    # 23:50, 02:50 IST). A quick check runs first; the heavy install + render
    # only happens when a new WeatherNext 3, ECMWF IFS or AIFS run exists.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model for a forced run (only used when 'run' is filled)"
        required: false
        type: choice
        options: [wn3, ifs, aifs]
        default: wn3
      run:
        description: "Force one run: WN3 20261019_00hr_01_preds, IFS/AIFS 20261019_12 (empty = automatic)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weathernext3
  cancel-in-progress: false

env:
  SITE_DIR: site
  KEEP_RUNS: "4"
  CF_PROJECT: masrainman-wn3        # Cloudflare Pages project name
  # To save GitHub minutes, draw only the 15-day ECMWF runs (00Z and 12Z):
  # remove the # at the start of the next line.
  # ECMWF_CYCLES: "00,12"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current maps (site-data branch)
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin site-data >/dev/null 2>&1; then
            git fetch --depth 1 origin site-data
            git --work-tree=site checkout origin/site-data -- .
            git reset -q
          fi
          ls site/runs 2>/dev/null || echo "(no WeatherNext 3 maps yet)"
          ls site/ecmwf/ifs site/ecmwf/aifs 2>/dev/null || echo "(no ECMWF maps yet)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google login (your WeatherNext access)
        env:
          GCP_CREDS: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_CREDS" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Quick check for new runs
        id: check
        run: |
          pip install -q google-auth requests
          python check_new.py

      # ---------- everything below runs only when there is work ----------

      - name: Install packages
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        run: |
          pip install -q -r requirements.txt
          # ECMWF GRIB reading (eccodes wheel includes the library)
          pip install -q requests xarray cfgrib "eccodes>=2.39"

      - name: Cache map coastlines
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Render new runs
        id: render
        if: steps.check.outputs.new == 'true' || github.event.inputs.run != ''
        run: |
          if [ -n "${{ github.event.inputs.run }}" ]; then
            python render.py --model "${{ github.event.inputs.model }}" --run "${{ github.event.inputs.run }}"
          else
            python render.py
          fi

      # ---------- Extreme Forecast Index (WeatherNext 3, Day 1-7) ----------
      # Needs the climate files from the "EFI climate (one-time)" workflow.
      # Never blocks the low-centre maps: failures here are only reported.

      - name: Cache EFI climate
        id: efi-cache
        if: steps.render.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: climate
          key: efi-climate-${{ hashFiles('efi_climate.py') }}-v1

      - name: Get EFI climate (release efi-climate)
        if: steps.render.outcome == 'success' && steps.efi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view efi-climate >/dev/null 2>&1; then
            gh release download efi-climate --dir climate --pattern '*.npz' --clobber
            ls climate | wc -l
          else
            echo "No efi-climate release yet - run the 'EFI climate (one-time)' workflow."
          fi

      - name: Extreme Forecast Index maps
        if: steps.render.outcome == 'success' && (github.event.inputs.run == '' || github.event.inputs.model == 'wn3')
        continue-on-error: true
        run: |
          if [ -z "$(ls climate/*.npz 2>/dev/null)" ]; then
            echo "EFI skipped: no climate files."; exit 0
          fi
          if [ -n "${{ github.event.inputs.run }}" ]; then
            python efi.py --run "${{ github.event.inputs.run }}"
          else
            python efi.py
          fi

      - name: Save maps (site-data branch, private)
        if: steps.render.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: site-data
          force_orphan: true   # keeps repo small: no image history
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "MasRainman model maps update"

      - name: Publish to Cloudflare Pages (login-protected)
        if: steps.render.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
